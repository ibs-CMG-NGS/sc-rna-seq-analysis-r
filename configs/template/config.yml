# ============================================================
# scRNA-seq 3rd Analysis Pipeline - Base Config
#
# This file is always loaded by the Snakefile as the default.
# For a new run, copy one of the mode-specific starters:
#   configs/template/config_explore.yml   (exploratory, no replicates)
#   configs/template/config_compare.yml   (comparative statistics)
# to configs/config_<experiment>.yml, then edit it.
# configs/config_*.yml is gitignored.
# ============================================================

# ── General ────────────────────────────────────────────────
species: "human"          # "human" | "mouse"
output_dir: "output"

# DE cutoffs (top-level for consistency with bulk pipeline)
padj_cutoff: 0.05
log2fc_cutoff: 1.0

# ── Single-cell input ──────────────────────────────────────
single_cell:
  input_path: ""            # path to .rds (Seurat) or .h5ad (AnnData)
  input_format: "seurat"    # "seurat" | "anndata"
  cell_type_column: "cell_type"
  sample_column: "sample_id"
  condition_column: "condition"
  # List of cell types to include; null = all
  cell_types: null
  min_cells_per_group: 10   # minimum cells per sample×cell_type for pseudobulk
  counts_layer: "counts"    # AnnData layer holding raw counts (used only for .h5ad input)

# ── Pseudobulk DE ──────────────────────────────────────────
de_analysis:
  method: "DESeq2"          # "DESeq2" | "edgeR"
  # Reference level for condition (leave empty to use first alphabetically)
  reference_level: ""
  # Additional covariates to include in the model (e.g. ["batch", "sex"])
  covariates: []

# ── Enrichment ─────────────────────────────────────────────
enrichment:
  go_ontologies: ["BP", "CC", "MF"]
  run_kegg: true
  pvalue_cutoff: 0.05
  qvalue_cutoff: 0.2
  min_gs_size: 10
  max_gs_size: 500

# ── cmg-seqviewer handoff export (Track B, E1) ─────────────
# Producer-side export of DE / GO·KEGG results as parquet bundles that
# cmg-seqviewer (or any table-based viewer) can consume. The viewer never
# reads Seurat/.h5ad objects directly.
export_seqviewer:
  enabled: true
  schema_version: "1.0"

# ── Core module toggles ────────────────────────────────────
# Set to false for exploratory-only runs (e.g. atlas gene-panel exploration
# without biological replicates). enrichment requires pseudobulk_de.
modules:
  pseudobulk_de: true
  composition: true
  enrichment: true

# ── Optional modules ───────────────────────────────────────
optional_modules:
  trajectory: false
  cell_communication: true
  label_transfer: false
  exploration: false

# ── Exploratory gene-panel expression (Phase 5b) ──────────
# Works on any annotated object, regardless of replicates.
# Enable via either optional_modules.exploration or exploration.enabled.
exploration:
  enabled: false
  genes: []                 # e.g. ["Glp1r", "Pnoc"]
  group_by: "C185_named"    # cell-type column to summarize
  split_by: "Dataset"       # optional per-dataset breakdown; "" = off
  min_cells: 10             # minimum cells per group
  exclude_column: "Author_Exclude"
  exclude_values: ["yes"]
  assay: "RNA"
  top_n: 20                 # top cell types per gene (tables/plots)

# ── Full expression export (viewer exploration, optional) ──
# Aggregated gene x cell_type table (no cell-level values). Enables GUI
# exploration of any gene without a predefined panel.
expression_export:
  enabled: false
  cell_type_column: "C185_named"
  cell_types: null          # null = all
  genes: null               # null = all
  by_dataset: false         # add per-dataset rows
  dataset_column: "Dataset"
  datasets: null            # null = all (used only when by_dataset: true)
  min_cells: 10
  assay: "RNA"
  value_layer: "data"       # normalized layer used for mean_expression
  counts_layer: "counts"    # raw counts used for detection
  exclude_column: "Author_Exclude"
  exclude_values: ["yes"]
  drop_zero_rows: true      # omit long rows with n_expressing = 0
  gene_id_type: "symbol"
  format: "parquet"         # "parquet" | "csv"
  species: "mouse"
  # Static summary figures (09_plot_expression.R)
  plots: true
  plots_top_genes: 50       # genes per heatmap (top-enriched selection)
  plots_marker_top_n: 40    # cell types in the marker dot plot
  plots_genes: null         # extra genes to force into the gene panel
  plots_max_cell_types: 0   # 0 = all cell types
  plots_min_pct: 10
  plots_min_mean: 0.05
  plots_dpi: 150
  plots_pdf: true

# ── Phase 0a: Label transfer (optional, reference-map) ─────
label_transfer:
  method: "mapscvi"         # mapscvi only (HypoMap frozen scVI model)
  label_column: "C66_named" # reference metadata column to project (HypoMap: C66_named | C185_named)
  max_epochs: 20            # scVI mapping epochs
  suffix: "query"           # internal suffix used by mapscvi

# ── Trajectory (Phase 4, optional) ────────────────────────
trajectory:
  method: "monocle3"        # "monocle3" | "slingshot"
  # Starting cell type for root selection
  root_cell_type: ""
  # Starting cluster (within root_cell_type) - leave empty for manual selection
  root_cluster: ""

# ── Cell-Cell Communication (Phase 5, optional) ────────────
cell_communication:
  method: "CellChat"        # "CellChat" | "LIANA"
  # Condition to use as "sender" context (leave empty = all conditions)
  conditions_to_compare: []

# ── Report ─────────────────────────────────────────────────
report:
  title: "scRNA-seq Analysis Report"
  author: ""
  generate_methods_draft: true
